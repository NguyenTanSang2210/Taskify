services:
  db:
    image: mysql:8.4
    container_name: taskify-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-doan_ltmmt}
      MYSQL_USER: ${MYSQL_USER:-ktpm}
      # Mật khẩu KHÔNG có giá trị mặc định: thiếu là compose báo lỗi (tạo bằng .\scripts\init-env.ps1)
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD trong .env — chạy .\scripts\init-env.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env — chạy .\scripts\init-env.ps1}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Mật khẩu đọc từ biến môi trường TRONG container (MYSQL_PWD), không nằm trên dòng lệnh
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: taskify-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      # Giờ ứng dụng (giờ Việt Nam); TZ để log của container cũng theo giờ này. CSDL vẫn lưu UTC (serverTimezone=UTC)
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      TZ: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      # Seed dữ liệu demo chỉ có tác dụng với profile dev
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_OTP_EMAIL: ${APP_SEED_OTP_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # P4-10: chạy nhiều instance — bật bằng docker-compose.scale.yml (xem docs/DEPLOYMENT.md §8)
      APP_REALTIME_RELAY_ENABLED: ${APP_REALTIME_RELAY_ENABLED:-false}
      APP_REALTIME_RELAY_HOST: ${APP_REALTIME_RELAY_HOST:-rabbitmq}
      APP_REALTIME_RELAY_PASSCODE: ${APP_REALTIME_RELAY_PASSCODE:-}
      APP_RATE_LIMIT_STORE: ${APP_RATE_LIMIT_STORE:-memory}
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-doan_ltmmt}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-ktpm}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD trong .env — chạy .\scripts\init-env.ps1}
      # Secret ký JWT: BẮT BUỘC, không có giá trị mặc định (secret mặc định công khai = ai cũng giả mạo được token ADMIN)
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env — chạy .\scripts\init-env.ps1}
      # P3-14: access token 15 phút (giữ trong bộ nhớ trình duyệt), làm mới bằng refresh token 7 ngày trong cookie HttpOnly
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      APP_AUTH_REFRESH_TTL_DAYS: ${APP_AUTH_REFRESH_TTL_DAYS:-7}
      # Cookie Secure cần HTTPS khi truy cập bằng tên miền/IP; http://localhost vẫn hoạt động. Không có TLS → đặt false
      APP_AUTH_REFRESH_COOKIE_SECURE: ${APP_AUTH_REFRESH_COOKIE_SECURE:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_HOST_PORT:-5175}}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@example.local}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-change-me}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - ./Backend/uploads:/app/uploads
      # Log JSON xoay vòng (profile prod, P3-08): /app/logs/taskify.log
      - backend_logs:/app/logs
    # P3-08: "healthy" khi ứng dụng sẵn sàng phục vụ và kết nối được CSDL (readiness)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-5175}:80"

  # ---- P4-08: giám sát — chỉ chạy khi bật profile: docker compose --profile monitoring up -d ----
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: taskify-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Ghi token ra file để Prometheus gửi header X-Metrics-Token (prometheus.yml: http_headers.files)
    entrypoint: ["/bin/sh", "-c", "printf %s \"$$METRICS_TOKEN\" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-127.0.0.1:9090}:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: taskify-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskify-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-127.0.0.1:3000}:3000"

volumes:
  mysql_data:
  backend_logs:
  prometheus_data:
  grafana_data:
