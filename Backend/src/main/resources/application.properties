spring.application.name=Backend
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Token tạm cho một bước của luồng đăng nhập (nhập OTP / đổi mật khẩu bắt buộc): 10 phút
jwt.preauth-expiration=${JWT_PREAUTH_EXPIRATION:600000}

# App security toggles
app.seed.enabled=${APP_SEED_ENABLED:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5175}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

spring.jackson.serialization.write-dates-as-timestamps=false

# Upload: một nguồn duy nhất cho thư mục lưu file + giới hạn 20 MB (kiểm tra thêm trên kích thước thực)
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:20971520}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:25MB}

# OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.show-actuator=false

# --- Đứng sau nginx/proxy: lấy IP THẬT của client cho khóa/giới hạn đăng nhập.
# Tomcat (RemoteIpValve) chỉ tin X-Forwarded-For khi request đến từ proxy nội bộ (dải IP private/loopback).
# Production KHÔNG nên mở cổng backend ra ngoài (chỉ qua nginx) để header này không giả mạo được.
server.forward-headers-strategy=native

# --- Giới hạn tần suất theo IP (SecurityProperties) — mặc định an toàn cho production
app.security.rate.login-per-minute=${APP_RATE_LOGIN_PER_MINUTE:10}
app.security.rate.otp-verify-per-minute=${APP_RATE_OTP_VERIFY_PER_MINUTE:10}
app.security.rate.otp-resend-per-10-minutes=${APP_RATE_OTP_RESEND_PER_10_MINUTES:5}
app.security.rate.activate-per-10-minutes=${APP_RATE_ACTIVATE_PER_10_MINUTES:10}
app.security.rate.upload-per-10-minutes=${APP_RATE_UPLOAD_PER_10_MINUTES:30}

# --- Khóa tạm theo cặp (username, IP): sai N lần trong cửa sổ => khóa
app.security.login.max-failures=${APP_LOGIN_MAX_FAILURES:5}
app.security.login.window-minutes=${APP_LOGIN_WINDOW_MINUTES:15}
app.security.login.lock-minutes=${APP_LOGIN_LOCK_MINUTES:10}
