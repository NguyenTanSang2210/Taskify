spring.application.name=Backend
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

# Schema do Flyway quản lý (src/main/resources/db/migration) — Hibernate chỉ kiểm tra khớp với entity (P3-01)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# DB đã có từ trước (do ddl-auto=update tạo, chưa có flyway_schema_history): đánh dấu version 0 rồi chạy V1… —
# V1 viết dạng "chỉ tạo/thêm khi còn thiếu" nên an toàn với DB cũ
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
jwt.secret=${JWT_SECRET:}
# P3-14: access token ngắn hạn (15 phút), làm mới bằng refresh token trong cookie HttpOnly
jwt.expiration=${JWT_EXPIRATION:900000}
# Token tạm cho một bước của luồng đăng nhập (nhập OTP / đổi mật khẩu bắt buộc): 10 phút
jwt.preauth-expiration=${JWT_PREAUTH_EXPIRATION:600000}

# App security toggles
app.seed.enabled=${APP_SEED_ENABLED:false}
# Tạo ADMIN đầu tiên cho bản cài mới (chỉ khi chưa có ADMIN nào): tài khoản chưa kích hoạt, mã kích hoạt gửi qua email
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:Qu\u1ea3n tr\u1ecb vi\u00ean}
# P4-02: lưu nhật ký hệ thống bấy nhiêu tháng (0 = giữ mãi); nhật ký điểm số (GRADE_*) luôn được giữ
app.audit.retention-months=${APP_AUDIT_RETENTION_MONTHS:12}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5175}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@example.local}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

spring.jackson.serialization.write-dates-as-timestamps=false
# Giờ ứng dụng = giờ Việt Nam (xem config/AppTimeZone). CSDL vẫn lưu UTC nhờ serverTimezone=UTC trong DB_URL — GIỮ NGUYÊN tham số đó.
spring.jackson.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

# Upload: một nguồn duy nhất cho thư mục lưu file + giới hạn 20 MB (kiểm tra thêm trên kích thước thực)
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:20971520}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:25MB}

# OpenAPI/Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.show-actuator=false

# --- Đứng sau nginx/proxy: lấy IP THẬT của client cho khóa/giới hạn đăng nhập.
# Tomcat (RemoteIpValve) chỉ tin X-Forwarded-For khi request đến từ proxy nội bộ (dải IP private/loopback).
# Production KHÔNG nên mở cổng backend ra ngoài (chỉ qua nginx) để header này không giả mạo được.
server.forward-headers-strategy=native

# --- Giới hạn tần suất theo IP (SecurityProperties) — mặc định an toàn cho production
app.security.rate.login-per-minute=${APP_RATE_LOGIN_PER_MINUTE:10}
app.security.rate.otp-verify-per-minute=${APP_RATE_OTP_VERIFY_PER_MINUTE:10}
app.security.rate.otp-resend-per-10-minutes=${APP_RATE_OTP_RESEND_PER_10_MINUTES:5}
app.security.rate.activate-per-10-minutes=${APP_RATE_ACTIVATE_PER_10_MINUTES:10}
app.security.rate.upload-per-10-minutes=${APP_RATE_UPLOAD_PER_10_MINUTES:30}
app.security.rate.refresh-per-minute=${APP_RATE_REFRESH_PER_MINUTE:300}

# --- Khóa tạm theo cặp (username, IP): sai N lần trong cửa sổ => khóa
app.security.login.max-failures=${APP_LOGIN_MAX_FAILURES:5}
app.security.login.window-minutes=${APP_LOGIN_WINDOW_MINUTES:15}
app.security.login.lock-minutes=${APP_LOGIN_LOCK_MINUTES:10}

# ===== P4-10: chạy nhiều instance backend (xem docs/DEPLOYMENT.md) =====
# Bộ đếm giới hạn tần suất: memory = riêng từng instance | jdbc = bảng rate_limit_windows dùng chung
app.rate-limit.store=${APP_RATE_LIMIT_STORE:memory}
# Realtime qua RabbitMQ (STOMP relay). Tắt = broker trong bộ nhớ: chỉ đúng khi chạy MỘT instance
app.realtime.relay.enabled=${APP_REALTIME_RELAY_ENABLED:false}
app.realtime.relay.host=${APP_REALTIME_RELAY_HOST:rabbitmq}
app.realtime.relay.port=${APP_REALTIME_RELAY_PORT:61613}
app.realtime.relay.login=${APP_REALTIME_RELAY_LOGIN:taskify}
app.realtime.relay.passcode=${APP_REALTIME_RELAY_PASSCODE:}
app.realtime.relay.virtual-host=${APP_REALTIME_RELAY_VHOST:/}

# ===== P3-08: log + giám sát =====
# Mã yêu cầu (X-Request-Id, RequestIdFilter) trong mọi dòng log dạng chữ
logging.pattern.correlation=[%X{requestId:-}] 
# Chỉ mở health + info; chi tiết thành phần (CSDL, email, ổ đĩa) chỉ hiện cho ADMIN
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
# readiness (healthcheck Docker) chỉ phụ thuộc CSDL: máy chủ email chập chờn không làm container "unhealthy"
# (email có hàng đợi + thử lại); /actuator/health tổng vẫn báo trạng thái email
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.info.java.enabled=true
# P4-08: Prometheus — chỉ trả số liệu khi request có header X-Metrics-Token đúng METRICS_TOKEN (để trống = tắt hẳn)
app.metrics.token=${METRICS_TOKEN:}
management.metrics.tags.application=taskify-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
info.app.name=Taskify
# (giá trị viết bằng \uXXXX: Spring đọc file .properties theo ISO-8859-1)
info.app.description=H\u1ec7 th\u1ed1ng qu\u1ea3n l\u00fd \u0111\u1ed3 \u00e1n / \u0111\u1ec1 t\u00e0i

# ===== P3-14: refresh token =====
app.auth.refresh-ttl-days=${APP_AUTH_REFRESH_TTL_DAYS:7}
# Cookie Secure: bắt buộc HTTPS khi truy cập qua tên miền/IP (http://localhost vẫn được trình duyệt chấp nhận)
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
