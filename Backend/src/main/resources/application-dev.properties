spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doan_ltmmt?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Dev profile is allowed to seed demo data when explicitly enabled.
app.seed.enabled=${APP_SEED_ENABLED:true}
# Email nhận OTP cho tài khoản demo admin/deptadmin/lecturer (Gmail plus-addressing: ten+admin@gmail.com ...)
app.seed.otp-email=${APP_SEED_OTP_EMAIL:}

# Local-only fallback key for development convenience. Replace with JWT_SECRET in real environments.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktand0LXNlY3JldC1jaGFuZ2UtbWUtMjAyNg==}

logging.level.org.springframework.security=INFO
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI công khai (không cần token để MỞ trang; gọi API vẫn cần Authorize bằng Bearer) — CHỈ dev
app.swagger.public=true

# Dev: nới giới hạn tần suất theo IP để smoke test / Swagger thủ công không bị chặn (production giữ mặc định chặt).
# Muốn thử đúng ngưỡng production: đặt biến môi trường APP_RATE_LOGIN_PER_MINUTE=10 ...
app.security.rate.login-per-minute=${APP_RATE_LOGIN_PER_MINUTE:120}
app.security.rate.otp-verify-per-minute=${APP_RATE_OTP_VERIFY_PER_MINUTE:120}
app.security.rate.otp-resend-per-10-minutes=${APP_RATE_OTP_RESEND_PER_10_MINUTES:60}
app.security.rate.activate-per-10-minutes=${APP_RATE_ACTIVATE_PER_10_MINUTES:120}
app.security.rate.upload-per-10-minutes=${APP_RATE_UPLOAD_PER_10_MINUTES:300}
