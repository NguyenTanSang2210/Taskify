spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.seed.enabled=false

jwt.secret=${JWT_SECRET:}

# Tài liệu API (Swagger) tắt hoàn toàn ở production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.org.springframework.security=WARN
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mail Production Config
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# P3-08: log JSON (Logstash) cho console và file xoay vòng — có sẵn requestId (MDC); dev giữ log dạng chữ
logging.structured.format.console=logstash
logging.file.name=${LOG_FILE:logs/taskify.log}
logging.structured.format.file=logstash
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB
