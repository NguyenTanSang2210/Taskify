# P4-08 — Prometheus thu số liệu của backend Taskify (docker compose --profile monitoring up -d).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: taskify-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
    # Backend chỉ trả số liệu khi có header này (= METRICS_TOKEN); entrypoint ghi token ra file lúc khởi động
    http_headers:
      X-Metrics-Token:
        files: [/tmp/metrics_token]
