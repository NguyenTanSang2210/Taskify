name: Project CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # Job 1: Backend — test (MySQL thật qua Testcontainers, không cần service MySQL) + ngưỡng độ phủ JaCoCo
  backend-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify = test + đóng gói + kiểm tra ngưỡng độ phủ (toàn bộ ≥ 75%, gói service ≥ 80%; xem pom.xml)
      # Không đặt DB_URL → test tự chạy MySQL 8.4 trong Docker (Testcontainers, xem support/TestDatabase.java)
      - name: Test, coverage check and package
        run: |
          cd Backend
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Backend/target/site/jacoco/
          if-no-files-found: ignore

  # Job 2: Frontend — lint, test (Vitest), build
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint, test and build
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  # Job 3: Chạy thật cả hệ thống bằng docker compose (profile prod) và gọi healthcheck
  docker-compose-check:
    needs: [backend-test-and-build, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Start the stack (waits for healthchecks)
        env:
          MYSQL_PASSWORD: ci-db-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: |
          # Khóa JWT ngẫu nhiên cho lượt chạy (profile prod từ chối khóa dev công khai)
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke check
        run: |
          curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '"UP"'
          curl -fsS http://localhost:8080/actuator/info | grep -q 'Taskify'
          curl -fsS -o /dev/null http://localhost:5175/
          # nginx chuyển tiếp /api tới backend: chưa có cookie phiên → 401 dạng lỗi chuẩn
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5175/api/auth/refresh)" = "401"
          docker compose ps

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
